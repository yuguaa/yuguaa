<svg width="920" height="170" viewBox="0 0 920 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Commit glitch gate">
  <defs>
    <linearGradient id="gateLine" x1="80" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset=".34" stop-color="#FF2BD6"/>
      <stop offset=".68" stop-color="#F9F871"/>
      <stop offset="1" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="hotGlow" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes tear {
        0%, 100% { transform: translateX(0); opacity: .35; }
        8% { transform: translateX(-24px); opacity: .9; }
        12% { transform: translateX(18px); opacity: .42; }
        18% { transform: translateX(-6px); opacity: .76; }
        22%, 64% { transform: translateX(0); opacity: .28; }
        70% { transform: translateX(32px); opacity: .96; }
        74% { transform: translateX(-18px); opacity: .45; }
      }

      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: 1; }
      }

      .tear-a { animation: tear 3.1s steps(2, end) infinite; transform-box: fill-box; }
      .tear-b { animation: tear 4.2s steps(2, end) infinite reverse; transform-box: fill-box; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .title { font: 900 30px "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 6px; }
      .sub { font: 800 12px "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 5px; }
    </style>
  </defs>

  <rect width="920" height="170" fill="transparent"/>

  <g filter="url(#hotGlow)">
    <path d="M70 28H850M70 142H850" stroke="url(#gateLine)" stroke-width="2"/>
    <path class="tear-a" d="M96 54H306M616 54H820" stroke="#00F5FF" stroke-width="7" stroke-linecap="square"/>
    <path class="tear-b" d="M146 110H420M536 110H772" stroke="#FF2BD6" stroke-width="6" stroke-linecap="square"/>
    <path class="tear-a" d="M78 78H202M704 78H846" stroke="#F9F871" stroke-width="4" stroke-linecap="square"/>
    <text class="title" x="460" y="82" text-anchor="middle" fill="#111827">COMMIT HEAT LEAK</text>
    <text class="title tear-a" x="458" y="82" text-anchor="middle" fill="#00F5FF" opacity=".46">COMMIT HEAT LEAK</text>
    <text class="title tear-b" x="462" y="82" text-anchor="middle" fill="#FF2BD6" opacity=".42">COMMIT HEAT LEAK</text>
    <text class="sub pulse" x="460" y="116" text-anchor="middle" fill="#7C2D12">NO CLEAN GRID / ONLY SIGNAL NOISE / OUTPUT_BRANCH_ONLINE</text>
  </g>

  <g class="pulse">
    <circle cx="92" cy="28" r="4" fill="#7C2D12"/>
    <circle cx="828" cy="142" r="4" fill="#00F5FF"/>
    <circle cx="128" cy="142" r="3" fill="#FF2BD6"/>
    <circle cx="792" cy="28" r="3" fill="#166534"/>
  </g>
</svg>
